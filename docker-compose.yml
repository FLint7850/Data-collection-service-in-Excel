services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data-collection-service-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NUXT_BACKEND_URL: http://parser:5000
    depends_on:
      parser:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/login").then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  parser:
    build: .
    container_name: data-collection-service-in-excel
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      PORT: 5000
      LOG_DIR: /app/logs
      FEED_DIR: /app/feeds
      LOGS_FILE: /app/logs/logs.json
      UNIFIED_LOG_FILE: /app/logs/app.log
      EXPORT_DIR: /app/exports
      FILE_IMPORT_DIR: /app/storage/file-import
      TMPDIR: /tmp/parser
      FORCE_BROWSER_SETUP: 0
      SQLITE_JOURNAL_MODE: WAL
      SQLITE_BUSY_TIMEOUT_MS: 30000
      WEB_GRACEFUL_TIMEOUT: 90
      WEB_CONCURRENCY: 1
      WEB_THREADS: 12
      GUNICORN_ACCESS_LOG: 0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./feeds:/app/feeds
      - ./storage:/app/storage
    shm_size: "768m"
    mem_limit: "5g"
    memswap_limit: "6g"
    cpus: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:alpine
    container_name: data-service-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      parser:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
