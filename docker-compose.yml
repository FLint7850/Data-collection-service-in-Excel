services:
  attribute-ai:
    build:
      context: .
      dockerfile: deploy/Dockerfile.attribute-ai
    container_name: data-collection-attribute-ai
    restart: unless-stopped
    environment:
      ATTRIBUTE_AI_HOST: 0.0.0.0
      ATTRIBUTE_AI_PORT: 4580
      ATTRIBUTE_CODEX_HOME: /state/codex
      ATTRIBUTE_CHATGPT_PROXY_URL: ${ATTRIBUTE_CHATGPT_PROXY_URL:-${OUTBOUND_PROXY_URL:-}}
      ATTRIBUTE_CODEX_PROXY_URL: ${ATTRIBUTE_CODEX_PROXY_URL:-}
      ATTRIBUTE_CHATGPT_BRIDGE_TOKEN: ${ATTRIBUTE_CHATGPT_BRIDGE_TOKEN:-}
    volumes:
      - ./storage/attribute-codex:/state/codex
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data-collection-service-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NUXT_BACKEND_URL: ${NUXT_BACKEND_URL:-http://parser:5000}
    depends_on:
      parser:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/login").then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  parser:
    build: .
    container_name: data-collection-service-in-excel
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      PORT: 5000
      FEED_DIR: /app/feeds
      EXPORT_DIR: /app/exports
      ATTRIBUTE_ASSISTANT_DIR: /app/storage/attribute-assistant
      ATTRIBUTE_CHATGPT_BRIDGE_URL: http://attribute-ai:4580
      ATTRIBUTE_CHATGPT_BRIDGE_TOKEN: ${ATTRIBUTE_CHATGPT_BRIDGE_TOKEN:-}
      FILE_IMPORT_DIR: /app/storage/file-import
      PRICE_CONVERTER_DIR: ${PRICE_CONVERTER_DIR:-storage/price-converter}
      OUTBOUND_PROXY_URL: ""
      OUTBOUND_PROXY_REQUIRED: "0"
      TMPDIR: /tmp/parser
      FORCE_BROWSER_SETUP: 0
      # DELETE is stable on Docker Desktop bind mounts. Linux deployments may
      # explicitly set SQLITE_JOURNAL_MODE=WAL for a database on a native volume.
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-DELETE}
      SQLITE_BUSY_TIMEOUT_MS: 30000
      WEB_GRACEFUL_TIMEOUT: 90
      WEB_CONCURRENCY: 1
      WEB_THREADS: ${WEB_THREADS:-3}
      GUNICORN_ACCESS_LOG: 0
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./feeds:/app/feeds
      - ./storage:/app/storage
    shm_size: "768m"
    mem_limit: "5g"
    memswap_limit: "6g"
    cpus: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: data-service-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      parser:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
